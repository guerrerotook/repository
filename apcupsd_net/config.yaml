name: APC UPS Daemon (Network)
version: 1.9.0
slug: apcupsd_net
description: View information from APC Network UPSs
url: https://github.com/guerrerotook/repository/tree/master/apcupsd_net
arch:
- aarch64
- amd64
- armhf
- armv7
- i386
init: false
startup: services
boot: auto
hassio_api: true
# "manager" is required to call the Supervisor host reboot/shutdown
# endpoints used by the hassio_poweroff/hassio_reboot scripts.
hassio_role: manager
map:
- share:rw
ports:
  3551/tcp: 3551
ports_description:
  3551/tcp: apcupsd NIS network information port
options:
  name: APC UPS
  cable: ether
  type: net
  device: ''
  extra: []
schema:
  name: str
  cable: str
  type: str
  device: str
  extra:
  - key: str
    val: str
